name: Ensure Vercel owner commit

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: vercel-owner-commit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  add-owner-commit:
    if: >-
      github.event.head_commit != null &&
      (github.event.head_commit.author.email == '226339791+Troy-LL@users.noreply.github.com' ||
       github.event.head_commit.author.email == 'Troy-LL@users.noreply.github.com')
    runs-on: ubuntu-latest

    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Add owner-authored deployment commit
        env:
          OWNER_NAME: Christine Julliane Laure Reyes
          OWNER_EMAIL: reyes.christinejulliane@gmail.com
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Do not append to a branch that advanced again while this job queued.
          git fetch origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse "origin/${GITHUB_REF_NAME}")" = "${PUSHED_SHA}"

          git config user.name "${OWNER_NAME}"
          git config user.email "${OWNER_EMAIL}"
          git commit --allow-empty -m "chore(deploy): authorize Vercel build for Troy's changes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
